<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="#0F0F0F"/>
  <!-- Outer red pill -->
  <rect x="76" y="136" width="360" height="240" rx="72" fill="url(#redGrad)" filter="url(#shadow)"/>
  <!-- White play triangle -->
  <polygon points="216,196 344,256 216,316" fill="#FFFFFF"/>
  <!-- Small ad-free badge -->
  <rect x="300" y="320" width="130" height="42" rx="10" fill="#00E676"/>
  <text x="365" y="348" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">AD-FREE</text>
  <!-- App text -->
  <text x="256" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">asi tube</text>
</svg>

