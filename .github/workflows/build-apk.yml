name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Copy Web Assets to Android Assets
      run: |
        mkdir -p android/app/src/main/assets
        cp -r public/* android/app/src/main/assets/

    - name: Grant Execute Permission to Gradle
      run: |
        cd android
        chmod +x gradlew

    - name: Build APK with Gradle Wrapper
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Output
      run: |
        mkdir -p release-artifacts
        cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/asi-tube-mobile.apk || cp android/app/build/outputs/apk/*/*.apk release-artifacts/asi-tube-mobile.apk || true
        cp release-artifacts/asi-tube-mobile.apk release-artifacts/asi-tube-v1.0.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: asi-tube-apk
        path: release-artifacts/*.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.2.0
        name: "asi tube mobile v1.2.0 - Landscape Rotation & Live YouTube Search"
        body: |
          ## 🎬 asi tube mobile v1.2.0 (Official Update)
          Official updated Android release for **asi tube mobile**!

          ### 📲 Download APK:
          Download `asi-tube-mobile.apk` (or `asi-tube-v1.0.apk`) below and install it directly on your Android device.

          ### ✨ Updates & Fixes in v1.2.0:
          - 🔄 **Forced Landscape Fullscreen**: Tapping fullscreen or the dedicated rotate button forces phone into horizontal landscape mode, automatically restoring portrait on exit or back button.
          - 🔍 **Universal YouTube & Creator Search**: Search for any YouTuber (e.g. *Ducky Bhai*, *MrBeast*, *MKBHD*) or video topic with live channel banners and real YouTube video results.
          - ⚡ **Real-Time YouTube RSS Sync**: Subscriptions automatically pull live uploads directly from YouTube creator feeds with zero external backend requirements.
          - 📱 **AMOLED Dark Theater Mode**: Seamless fullscreen viewing with zero ads.
        files: release-artifacts/*.apk
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

