name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Copy Web Assets to Android Assets
      run: |
        mkdir -p android/app/src/main/assets
        cp -r public/* android/app/src/main/assets/

    - name: Grant Execute Permission to Gradle
      run: |
        cd android
        chmod +x gradlew

    - name: Build APK with Gradle Wrapper
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Output
      run: |
        mkdir -p release-artifacts
        cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/asi-tube-mobile.apk || cp android/app/build/outputs/apk/*/*.apk release-artifacts/asi-tube-mobile.apk || true
        cp release-artifacts/asi-tube-mobile.apk release-artifacts/asi-tube-v1.0.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: asi-tube-apk
        path: release-artifacts/*.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.3.0
        name: "asi tube mobile v1.3.0 - YouTube API v3, AMOLED Themes, PiP & Mobile Drawer"
        body: |
          ## 🎬 asi tube mobile v1.3.0 (Official Update)
          Official updated Android release for **asi tube mobile**!

          ### 📲 Download APK:
          Download `asi-tube-mobile.apk` (or `asi-tube-v1.0.apk`) below and install it directly on your Android device.

          ### ✨ What's New in v1.3.0:
          - 🔑 **Google Cloud YouTube Data API v3 Integration**: Live YouTube popular feeds and universal search for any creator or topic using official Google Cloud YouTube Data API v3.
          - 📱 **Chronological Subscriptions Feed**: Videos from subscribed creators appear sequentially with newest uploads strictly on top, exactly like official YouTube.
          - 🖤 **True AMOLED Black Settings Modal & Theme Switcher**: Dedicated themes option in settings with **AMOLED Black** (#000000), **Dark Theme** (#181818), and **White / Light** (#ffffff), persisted in local storage.
          - ☰ **Working Mobile Hamburger Drawer**: Sliding left navigation drawer with dim backdrop and quick navigation.
          - 🖼️ **Picture-in-Picture (PiP) & Background Play**: Dedicated floating PiP window support on minimize or via player button, plus background audio playback when screen is locked or switching apps.
          - 🔄 **Forced Landscape Fullscreen**: One-click rotation into sensor landscape with auto-portrait restore.
        files: release-artifacts/*.apk
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

