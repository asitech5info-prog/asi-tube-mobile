name: Build ASI Tube Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle Web Assets to Android Package
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Prepare Gradle Wrapper
        run: |
          sed -i -e 's/\r$//' android/gradlew || true
          chmod +x android/gradlew || true

      - name: Compile Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --stacktrace

      - name: Find and Package APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/ASI-Tube-v2.0-debug.apk \;
          ls -la build-output/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASI-Tube-v2.0-Android-APK
          path: build-output/*.apk
          retention-days: 30
