name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Copy Web Assets to Android Assets
      run: |
        mkdir -p android/app/src/main/assets
        cp -r public/* android/app/src/main/assets/

    - name: Grant Execute Permission to Gradle
      run: |
        cd android
        chmod +x gradlew

    - name: Build APK with Gradle Wrapper
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Output
      run: |
        mkdir -p release-artifacts
        cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/asi-tube-mobile.apk || cp android/app/build/outputs/apk/*/*.apk release-artifacts/asi-tube-mobile.apk || true
        cp release-artifacts/asi-tube-mobile.apk release-artifacts/asi-tube-v1.0.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: asi-tube-apk
        path: release-artifacts/*.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.1.0
        name: "asi tube mobile v1.1.0 - Professional Android Release"
        body: |
          ## 🎬 asi tube mobile v1.1.0 (Professional Release)
          Official updated Android release for **asi tube mobile**!

          ### 📲 Download:
          Download `asi-tube-mobile.apk` below and install it directly on your Android device.

          ### ✨ Updates & Fixes in v1.1.0:
          - 🎨 **Fixed UI Styling**: Integrated `WebViewAssetLoader` and relative stylesheet linking so AMOLED dark theme, video cards, and bottom navigation render crisply without layout glitches.
          - ⚡ **Standalone Offline Mode**: Preloaded creators and catalog channels (MrBeast, MKBHD, Fireship, Rockstar Games, etc.) work without a local PC server.
          - 📺 **Ad-Free Embedded Player**: Stream any YouTube video ad-free with smart second resume.
          - 👥 **Subscriptions & Playlists**: Dedicated Subscriptions feed, Watch Later, and custom playlists persisted in storage.
        files: release-artifacts/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

